<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RaHa BIO - خميرة بلدية أعشاب طبيعية</title>
    <!-- هنا يتم وضع كود صفحة الهبوط الخاص بك -->
</head>
<body>

    <!-- نموذج الطلب (مثال للسكริبت المسؤول عن الإرسال) -->
    <form id="orderForm">
        <input type="text" name="name" placeholder="الاسم الكامل" required>
        <input type="tel" name="phone" placeholder="رقم الهاتف" required>
        <input type="text" name="city" placeholder="المدينة" required>
        <input type="text" name="addr" placeholder="العنوان (اختياري)">
        <select name="offer">
            <option value="عرض عبوة واحدة">عرض عبوة واحدة</option>
            <option value="عرض عبوتين بخصم">عرض عبوتين بخصم</option>
        </select>
        <button type="submit">تأكيد الطلب</button>
    </form>

    <div id="thankYouMessage" style="display:none;">
        <h2>شكراً لك! تم تسجيل طلبك بنجاح. سنتواصل معك قريباً لتأكيد التوصيل.</h2>
    </div>

    <script>
        // رابط السكريبت الخاص بك المربوط بـ Google Sheet
        var SCRIPT_URL = "https://script.google.com/macros/s/AKfycybm5ehfB_xRCTRjeDNJHYmfEcSHkHsOkzf9qHyvw6F/exec";

        const form = document.getElementById('orderForm');
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            var formData = {
                name: form.name.value,
                phone: form.phone.value,
                city: form.city.value,
                addr: form.addr.value,
                offer: form.offer.value
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            }).then(() => {
                form.style.display = 'none';
                document.getElementById('thankYouMessage').style.display = 'block';
            }).catch(error => {
                alert('حدث خطأ أثناء إرسال الطلب، يرجى المحاولة مرة أخرى.');
            });
        });
    </script>
</body>
</html>
